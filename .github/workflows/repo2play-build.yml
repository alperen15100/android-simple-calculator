name: Repo2Play Build

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "NEW or UPDATE"
        required: true
        default: "NEW"
        type: choice
        options:
          - NEW
          - UPDATE
      keystore_base64:
        description: "Existing Repo2Play JKS for UPDATE"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Analyze Build Sign Package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Repo2Play engine
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
          BUILD_MODE: ${{ inputs.build_mode }}
          APP_KEYSTORE_BASE64: ${{ inputs.keystore_base64 }}
        run: |
          set -euo pipefail
          chmod +x .repo2play/scripts/*.sh
          .repo2play/scripts/run.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/output"

      - name: Require release files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s output/app-release-signed.apk
          test -s output/app-release-signed.aab
          test -s output/repo2play-upload.jks

      - name: Upload Repo2Play release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Repo2Play-${{ inputs.build_mode }}-Result
          path: output/
          if-no-files-found: error
          retention-days: 7
